{% extends "base.html" %}
{% block title %}Xóa tin tuyển dụng{% endblock %}
{% block content %}<div class="container narrow py-5"><div class="card p-4 p-lg-5 text-center"><div class="logo-placeholder mx-auto mb-3 bg-danger-subtle text-danger"><i class="bi bi-trash"></i></div><h1 class="h4">Xóa tin tuyển dụng?</h1><p class="text-muted">Bạn sắp xóa <strong>{{ job.title }}</strong>. Hành động này không thể hoàn tác.</p><form method="post">{% csrf_token %}<button class="btn btn-danger">Xóa tin</button><a href="{% url 'employer-job-list' %}" class="btn btn-light border ms-2">Hủy</a></form></div></div>{% endblock %}
